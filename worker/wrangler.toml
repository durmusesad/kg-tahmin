name = "kg-tahmin-bulten"
main = "src/index.js"
compatibility_date = "2026-08-17"
account_id = "c8b3e790485df0cc8c4be0b2e8371216"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[kv_namespaces]]
binding = "KG_SNAPSHOTS"
id = "b175ff7362344b53ac47191d78d6b8a4"

[[kv_namespaces]]
binding = "HAVUZ_KV"
id = "d1ac45f394a5488282625dbfef016636"

[triggers]
# Cloudflare cron tetikleyicileri UTC'de çalışır. Türkiye UTC+3 (DST yok,
# sabit) olduğundan gece 03:00-08:59 TR (=00:00-05:59 UTC) arası neredeyse
# hiç canlı maç olmadığından worker'ı uyutuyoruz — CPU limitine takılma
# riskini azaltmak için gereksiz tick sayısını (günün %25'i) tamamen keser.
crons = ["* 6-23 * * *"]

[observability]
enabled = true
