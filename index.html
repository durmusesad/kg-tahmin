<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KG Tahmin</title>
<meta name="description" content="Nesine bülteninden canlı İY/MS KG ve 6+ Gol oranlarını geçmiş maç istatistikleriyle eşleştirip Karşılıklı Gol fırsatlarını sıralar.">
</head>
<body>
<style>
  :root{
    --ink:#211609;
    --ink-soft:color-mix(in srgb, var(--ink) 62%, transparent);
    --ink-faint:color-mix(in srgb, var(--ink) 42%, transparent);
    --parchment:#ffffff;
    --parchment-2:#f4f0e6;
    --parchment-3:#ece5d4;
    /* Ana aksan rengi: #001AFF mavi */
    --seal:#001AFF;
    --seal-dark:#0016d6;
    /* Canlı maç / kırmızı sinyal — semantik kırmızı, aksandan bağımsız */
    --live:#e63950;
    --live-dark:#c22740;
    --tile:#12b886;
    --tile-dark:#059669;
    --brass:#f2a93b;
    --brass-dark:#d98c0a;
    --card-bg:#fffdf8;
    --shadow:rgba(20,16,10,.10);
    --border:color-mix(in srgb, var(--brass) 32%, transparent);
    --focus:#2f7de1;
    --kupon:var(--seal);
    --kupon-dark:var(--seal-dark);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --ink:#e9e2d3;
    --ink-soft:color-mix(in srgb, var(--ink) 66%, transparent);
    --ink-faint:color-mix(in srgb, var(--ink) 44%, transparent);
    --parchment:#151109;
    --parchment-2:#1e1810;
    --parchment-3:#272016;
    --seal:#6e86ff;
    --seal-dark:#4c63e0;
    --live:#c1596a;
    --live-dark:#9c4353;
    --tile:#3fa285;
    --tile-dark:#2c7d67;
    --brass:#bd9350;
    --brass-dark:#96733c;
    --card-bg:#1b160e;
    --shadow:rgba(0,0,0,.45);
    --border:color-mix(in srgb, var(--brass) 30%, transparent);
    --focus:#6fa3e0;
    --kupon:var(--seal);
    --kupon-dark:var(--seal-dark);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
    padding-bottom:calc(94px + env(safe-area-inset-bottom));
    transition:background-color .2s ease, color .2s ease;
  }
  h1,h2,.display{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    text-wrap:balance;
    font-weight:700;
  }
  button, select{ font-family:inherit; }
  .weave{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(circle at 15% 20%, color-mix(in srgb, var(--brass) 10%, transparent) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, color-mix(in srgb, var(--seal) 8%, transparent) 0, transparent 45%),
      var(--parchment);
  }

  header.top{
    padding:clamp(12px,3.4vw,18px) 16px 8px;
    max-width:880px;
    margin:0 auto;
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .title-block h1{
    font-size:clamp(18px,4.4vw,24px);
    margin:0;
  }
  .top-actions{
    display:flex; gap:8px; flex:none;
  }
  .icon-btn{
    font-size:11.5px; font-weight:700;
    border:1px solid var(--border);
    background:var(--card-bg); color:var(--ink);
    border-radius:10px; padding:7px 11px;
    cursor:pointer; white-space:nowrap;
  }
  .icon-btn:active{transform:translateY(1px);}
  .icon-btn:disabled{
    opacity:.5; cursor:not-allowed; transform:none;
    font-variant-numeric:tabular-nums;
  }

  .meta-strip{
    display:flex; flex-wrap:wrap; align-items:baseline;
    gap:3px 14px;
    margin-top:10px;
    font-size:11.5px; font-weight:600;
    color:var(--ink-soft);
  }
  .meta-strip b{
    font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .meta-strip .mk b{color:var(--tile-dark);}
  .meta-strip .mo b{color:var(--brass-dark);}
  .meta-strip .upd{margin-left:auto;}
  .meta-strip .upd b{color:var(--ink-soft); font-weight:700;}

  main{max-width:880px; margin:0 auto; padding:14px 12px 0;}

  .filter-bar{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
    margin-bottom:16px;
  }
  .view-row{margin-bottom:8px;}
  .view-row label{
    display:block; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--ink-faint); margin-bottom:3px;
  }
  .view-row select{
    width:100%;
    border:1px solid var(--border);
    background:var(--parchment-2); color:var(--ink);
    border-radius:9px;
    padding:9px 10px;
    font-size:13px; font-weight:700;
  }

  .search-row{margin-bottom:8px;}
  .search-row input{
    width:100%;
    border:1px solid var(--border);
    background:var(--parchment-2); color:var(--ink);
    border-radius:9px;
    padding:9px 12px;
    font-size:13px; font-weight:600;
  }
  .search-row input::placeholder{color:var(--ink-faint); font-weight:400;}
  .search-row input:focus{outline:none; border-color:var(--kupon);}

  .filter-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .filter-controls label{
    display:block; font-size:9.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--ink-faint); margin-bottom:3px;
  }
  .filter-controls select{
    width:100%;
    border:1px solid var(--border);
    background:var(--parchment-2); color:var(--ink);
    border-radius:9px;
    padding:8px 8px;
    font-size:12.5px; font-weight:600;
  }

  .section-note{
    font-size:12px; margin:2px 4px 12px;
    color:var(--ink-soft);
  }

  .empty-note{
    text-align:center; font-size:13.5px; font-style:italic;
    color:var(--ink-faint);
    padding:26px 10px;
    background:var(--card-bg);
    border:1px dashed var(--border);
    border-radius:12px;
  }

  .match-list{display:flex; flex-direction:column; gap:10px;}

  .match-card{
    background:var(--card-bg);
    border:1.5px solid var(--border);
    border-left:4px solid var(--border);
    border-radius:14px;
    box-shadow:0 2px 8px var(--shadow);
    overflow:hidden;
  }
  .match-card.tier-kesin{border-left-color:var(--tile);}
  .match-card.tier-olasi{border-left-color:var(--brass);}

  .card-head{
    width:100%;
    display:block;
    text-align:left;
    background:none; border:none;
    padding:12px 14px;
    cursor:pointer;
    font:inherit; color:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .card-head:active{background:var(--parchment-2);}
  .match-top{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:6px;
  }
  .league{
    font-size:11px; font-weight:700; letter-spacing:.02em;
    color:var(--ink-soft);
    text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .kickoff-wrap{display:flex; align-items:center; gap:6px; flex:none;}
  .kickoff{
    font-size:12px; font-weight:700; flex:none;
    color:var(--ink);
    background:var(--parchment-2);
    padding:2px 9px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .teams-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .teams{
    font-weight:700; font-size:15px; line-height:1.3;
  }
  .live-badge{
    display:inline-flex; align-items:center; gap:5px; flex:none;
    font-size:12px; font-weight:800;
    color:var(--live);
    background:color-mix(in srgb, var(--live) 14%, var(--parchment-2));
    padding:2px 9px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .live-dot{
    width:7px; height:7px; border-radius:999px; flex:none;
    background:var(--live);
    animation:liveDotPulse 1.4s ease-in-out infinite;
  }
  @keyframes liveDotPulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.75);}
  }
  .live-score{
    font-weight:800; color:var(--live);
    font-variant-numeric:tabular-nums;
  }
  .live-detail-note{
    font-size:13px; font-weight:700;
    background:var(--parchment-2);
    border-radius:10px;
    padding:9px 10px;
  }
  .match-card.tier-kirmizi{border-left-color:var(--live);}
  .kirmizi-badge{
    display:inline-flex; align-items:center; gap:3px; flex:none;
    font-size:9.5px; font-weight:800;
    color:#fff; background:var(--live);
    padding:1px 7px; border-radius:999px;
    margin-left:6px; vertical-align:middle;
  }
  .kirmizi-sinyal{
    background:color-mix(in srgb, var(--live) 14%, var(--parchment-2));
    border:1px solid color-mix(in srgb, var(--live) 30%, transparent);
    border-radius:10px;
    padding:9px 10px;
    margin-bottom:8px;
  }
  .kirmizi-sinyal-baslik{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.02em;
    color:var(--live); margin-bottom:3px;
  }
  .kirmizi-sinyal-tahmin{font-size:14px; font-weight:800;}
  .kirmizi-sinyal-detay{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .chevron{
    flex:none;
    font-size:11px; color:var(--ink-faint);
    transition:transform .25s ease;
  }
  .match-card.expanded .chevron{transform:rotate(180deg);}

  .details{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .28s ease;
  }
  .match-card.expanded .details{grid-template-rows:1fr;}
  .details-inner{
    min-height:0;
    overflow:hidden;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .match-card.expanded .details-inner{opacity:1; transform:translateY(0);}
  .details-content{
    padding:0 14px 14px;
    border-top:1px solid var(--border);
    padding-top:11px;
  }

  .chip-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .chip-row + .chip-row{margin-top:8px;}
  .odd-chip, .stat-chip{
    background:var(--parchment-2);
    border-radius:10px;
    padding:7px 6px;
    text-align:center;
  }
  .odd-chip .lbl, .stat-chip .lbl{
    font-size:9.5px; font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .odd-chip .val, .stat-chip .val{
    font-size:15.5px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .odd-chip .val.dash{color:var(--ink-faint); font-weight:400;}
  .stat-chip .val{font-size:13.5px;}
  .stat-chip.kesin{background:color-mix(in srgb, var(--tile) 18%, var(--parchment-2));}
  .stat-chip.kesin .val{color:var(--tile-dark);}
  .stat-chip.olasi{background:color-mix(in srgb, var(--brass) 20%, var(--parchment-2));}
  .stat-chip.olasi .val{color:var(--brass-dark);}
  .stat-chip.pct .val{font-size:17px;}

  .add-coupon-btn{
    width:100%;
    margin-top:10px;
    border:1.5px solid var(--kupon);
    background:transparent;
    color:var(--kupon);
    border-radius:10px;
    padding:9px;
    font-weight:700; font-size:12.5px;
    cursor:pointer;
    transition:background-color .18s ease, color .18s ease;
  }
  .add-coupon-btn.added{
    background:var(--kupon);
    border-color:var(--kupon);
    color:#fff;
  }
  .add-coupon-btn:disabled{
    opacity:.45; cursor:not-allowed;
  }
  .in-kupon-dot{
    flex:none;
    width:8px; height:8px; border-radius:999px;
    background:var(--kupon);
  }

  /* ============== KUPON (kazanç hesaplayıcı) ============== */
  .dockbar{
    position:fixed; left:50%; z-index:60;
    bottom:calc(12px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    padding:7px;
    border-radius:999px;
    background:var(--card-bg);
    border:1px solid var(--border);
    box-shadow:0 10px 30px rgba(0,0,0,.26);
    max-width:calc(100vw - 20px);
  }
  .dock-btn{
    flex:none;
    width:54px; height:46px;
    display:flex; align-items:center; justify-content:center;
    border:none; border-radius:999px;
    background:transparent; color:var(--ink);
    cursor:pointer;
    transition:background-color .18s ease;
  }
  .dock-btn:active{transform:translateY(1px);}
  .dock-btn svg{width:21px; height:21px;}
  .dock-bulten.active{
    background:color-mix(in srgb, var(--brass) 24%, var(--parchment-2));
  }
  .dock-arsiv{opacity:.3; cursor:not-allowed;}
  .dock-kupon{
    flex:none;
    min-width:118px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:4px 24px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--parchment-2);
    color:var(--ink);
    cursor:pointer;
    line-height:1.14;
    transition:border-color .18s ease;
  }
  .dock-kupon:active{transform:translateY(1px);}
  .dock-kupon.active{border-color:var(--kupon);}
  .dock-kupon .dk-top{font-size:10px; font-weight:700; color:var(--ink-soft);}
  .dock-kupon .dk-mid{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}
  .dock-kupon .dk-bot{font-size:10px; font-weight:700; color:var(--ink-soft);}
  .dock-kupon.empty .dk-mid{color:var(--ink-faint);}

  .kupon-screen{
    animation:kuponScreenIn .22s ease;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:5px;
    border:none; background:none; color:var(--kupon);
    font-size:13px; font-weight:700; cursor:pointer;
    padding:4px 0; margin-bottom:10px;
  }
  .kupon-screen-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .kupon-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 10px;
    flex:none;
  }
  .kupon-head h2{margin:0; font-size:16px; color:var(--kupon);}
  .kupon-list{
    padding:0 16px;
  }
  .kupon-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    animation:kuponItemIn .22s ease;
  }
  .kupon-item.removing{
    animation:none;
    opacity:0; transform:translateX(10px);
    max-height:0; padding-top:0; padding-bottom:0; margin:0; border-bottom-width:0;
    transition:opacity .18s ease, transform .18s ease, max-height .2s ease .05s,
               padding .2s ease .05s, margin .2s ease .05s;
  }
  .kupon-item:last-child{border-bottom:none;}
  .kupon-item-info{min-width:0;}
  .kupon-item-teams{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kupon-item-market{font-size:10px; color:var(--ink-soft); margin-top:1px;}
  .kupon-item-right{display:flex; align-items:center; gap:8px; flex:none;}
  .kupon-item-odd{font-weight:800; font-size:13px; font-variant-numeric:tabular-nums; color:var(--kupon);}
  .kupon-item-remove{
    border:none; background:none; color:var(--ink-faint);
    width:20px; height:20px; border-radius:999px; font-size:12px; cursor:pointer;
  }
  .kupon-empty{
    text-align:center; font-size:12.5px; color:var(--ink-faint);
    padding:22px 10px;
  }
  .kupon-calc{
    padding:10px 16px 16px;
    border-top:1px solid var(--border);
    margin-top:6px;
  }
  .kupon-calc-row{
    display:flex; align-items:baseline; justify-content:space-between;
    font-size:11.5px; color:var(--ink-soft);
    padding:3px 0;
  }
  .kupon-calc-row .v{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
  .kupon-stake-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:7px 0 3px;
  }
  .kupon-stake-row label{font-size:11.5px; color:var(--ink-soft); flex:none;}
  .kupon-stake-row input{
    width:100px;
    border:none; border-bottom:1.5px solid var(--border);
    background:none; color:var(--ink);
    padding:2px 2px; text-align:right;
    font-size:14px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .kupon-stake-row input:focus{outline:none; border-bottom-color:var(--kupon);}
  .kupon-payout{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:8px 0 2px;
  }
  .kupon-payout .l{font-size:11.5px; color:var(--ink-soft);}
  .kupon-payout .v{font-size:19px; font-weight:800; color:var(--kupon); font-variant-numeric:tabular-nums;}
  .kupon-clear-btn{
    border:none;
    background:none; color:var(--ink-faint);
    padding:6px 0 0;
    font-size:11px; font-weight:700; cursor:pointer;
    text-decoration:underline;
  }
  .kupon-note{
    font-size:9.5px; color:var(--ink-faint);
    margin:6px 0 0;
    line-height:1.35;
  }

  @keyframes kuponItemIn{
    from{opacity:0; transform:translateX(-8px);}
    to{opacity:1; transform:translateX(0);}
  }
  @keyframes kuponScreenIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }


  @media (max-width:380px){
    .odd-chip .val{font-size:14px;}
    .filter-controls{grid-template-columns:1fr;}
  }
</style>

<div class="weave"></div>

<header class="top">
  <div class="top-row">
    <div class="title-block">
      <h1>KG Tahmin</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn">Koyu Tema</button>
    </div>
  </div>

  <div class="meta-strip">
    <span><b id="statTotal">–</b> maç</span>
    <span class="mk"><b id="statKesin">–</b> kesin</span>
    <span class="mo"><b id="statOlasi">–</b> olası</span>
    <span class="upd">güncel <b id="statUpdated">–</b></span>
  </div>
</header>

<main>
  <div id="bultenScreen">
    <div class="filter-bar">
      <div class="view-row">
        <label for="viewSelect">Görünüm</label>
        <select id="viewSelect">
          <option value="tum">Tüm Bülten</option>
          <option value="kesin">Kesin Eşleşme</option>
          <option value="olasi">Olası Eşleşme</option>
          <option value="canli">Canlı</option>
        </select>
      </div>
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Takım veya lig ara…" autocomplete="off">
      </div>
      <div class="filter-controls">
        <div>
          <label for="ligSelect">Lig</label>
          <select id="ligSelect"><option value="">Tüm Ligler</option></select>
        </div>
        <div>
          <label for="sortSelect">Sırala</label>
          <select id="sortSelect"></select>
        </div>
      </div>
    </div>

    <p class="section-note" id="tabNote"></p>
    <div class="match-list" id="list"></div>
    <div class="empty-note" id="emptyNote" style="display:none;">Kriterlere uyan maç yok.</div>
  </div>

  <section id="kuponScreen" class="kupon-screen" hidden>
    <button type="button" class="back-link" id="kuponBackBtn">‹ Bültene Dön</button>
    <div class="kupon-screen-card">
      <div class="kupon-head"><h2>Kuponum</h2></div>
      <div class="kupon-list" id="kuponList"></div>
      <div class="kupon-calc">
        <div class="kupon-calc-row"><span>Maç Sayısı</span><span class="v" id="calcCount">0</span></div>
        <div class="kupon-calc-row"><span>Toplam Oran</span><span class="v" id="calcOran">0,00</span></div>
        <div class="kupon-stake-row">
          <label for="stakeInput">Tutar (TL)</label>
          <input type="number" id="stakeInput" min="0" step="1" placeholder="0" inputmode="decimal">
        </div>
        <div class="kupon-payout">
          <span class="l">Olası Kazanç</span>
          <span class="v" id="calcKazanc">0,00 TL</span>
        </div>
        <button class="kupon-clear-btn" id="kuponClearBtn">Kuponu Temizle</button>
        <p class="kupon-note">Oranlar iddaa.com tahmini (Nesine × 1,037). Gerçek bahis değildir, sadece kazanç hesaplayıcıdır.</p>
      </div>
    </div>
  </section>
</main>

<nav class="dockbar" id="dockbar" aria-label="Alt menü">
  <button type="button" class="dock-btn dock-bulten active" id="dockBulten" aria-label="Bülten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3.5" y1="6" x2="3.51" y2="6"/><line x1="3.5" y1="12" x2="3.51" y2="12"/><line x1="3.5" y1="18" x2="3.51" y2="18"/></svg>
  </button>
  <button type="button" class="dock-kupon empty" id="kuponPill" aria-label="Kuponum">
    <span class="dk-top"><b id="kuponPillCount">0</b> Maç</span>
    <span class="dk-mid" id="kuponPillOran">–</span>
    <span class="dk-bot">Oran</span>
  </button>
  <button type="button" class="dock-btn dock-arsiv" id="dockArsiv" aria-label="Arşiv (yakında)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2"/><line x1="16" y1="2.5" x2="16" y2="6.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m8.5 15.5 2.2 2.2 4.3-4.4"/></svg>
  </button>
</nav>

<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }

  /* ============== THEME ============== */
  const THEME_KEY = "kgtahmin-theme";
  function applyTheme(t){
    if (t === "dark"){
      document.documentElement.setAttribute("data-theme", "dark");
      $("themeBtn").textContent = "Açık Tema";
    } else {
      document.documentElement.removeAttribute("data-theme");
      $("themeBtn").textContent = "Koyu Tema";
    }
  }
  function initTheme(){
    // Varsayılan her zaman açık tema; yalnızca kullanıcı elle "dark" seçtiyse koyu.
    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved === "dark" ? "dark" : "light");
  }
  $("themeBtn").addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const next = isDark ? "light" : "dark";
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });
  initTheme();

  /* ============== STATE ============== */
  let allMatches = [];
  let liveMatches = [];
  let currentView = "tum"; // "tum" | "kesin" | "olasi" | "canli"
  let currentLeague = "";
  let currentSort = "time_asc";
  let searchQuery = "";
  let expandedIds = new Set();

  const SORTS = {
    rate_desc:  { label: "Tutma Oranı (Yüksek → Düşük)", cmp: (a,b) => (b.tutmaOrani ?? -1) - (a.tutmaOrani ?? -1) || (b.toplam ?? 0) - (a.toplam ?? 0) },
    rate_asc:   { label: "Tutma Oranı (Düşük → Yüksek)", cmp: (a,b) => (a.tutmaOrani ?? 2) - (b.tutmaOrani ?? 2) || (b.toplam ?? 0) - (a.toplam ?? 0) },
    time_asc:   { label: "Maç Saati (Yakın → Uzak)",     cmp: (a,b) => a.macZamani.localeCompare(b.macZamani) },
    mskg_desc:  { label: "MS KG Oranı (Yüksek → Düşük)", cmp: (a,b) => ((b.canliMsKg ?? b.msKg) ?? -1) - ((a.canliMsKg ?? a.msKg) ?? -1) },
    mskg_asc:   { label: "MS KG Oranı (Düşük → Yüksek)", cmp: (a,b) => ((a.canliMsKg ?? a.msKg) ?? 999) - ((b.canliMsKg ?? b.msKg) ?? 999) },
    gol6_desc:  { label: "6+ Gol Oranı (Yüksek → Düşük)", cmp: (a,b) => (b.altUst6 ?? -1) - (a.altUst6 ?? -1) },
    gol6_asc:   { label: "6+ Gol Oranı (Düşük → Yüksek)", cmp: (a,b) => (a.altUst6 ?? 999) - (b.altUst6 ?? 999) },
    iyms_desc:  { label: "İY/MS KG Oranı (Yüksek → Düşük)", cmp: (a,b) => (b.iymsKg ?? -1) - (a.iymsKg ?? -1) },
    iyms_asc:   { label: "İY/MS KG Oranı (Düşük → Yüksek)", cmp: (a,b) => (a.iymsKg ?? 999) - (b.iymsKg ?? 999) },
    live_recent: { label: "Yeni Başlayanlar (Yeniden Eskiye)", cmp: (a,b) => (b.macZamani || "").localeCompare(a.macZamani || "") },
  };
  const sortSelectEl = $("sortSelect");
  Object.keys(SORTS).forEach(key => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = SORTS[key].label;
    sortSelectEl.appendChild(opt);
  });
  sortSelectEl.value = currentSort;

  const VIEW_NOTES = {
    kesin: "Verilerini takip ettiğimiz 13 büyük ligden biri ve geçmişte en az 3 kez denenip hepsinde (%100) karşılıklı gol çıkmış oran çiftleri.",
    olasi: "Ya örnek sayısı 3'ten az, ya arşivde %100'ün altında tutmuş, ya da takip ettiğimiz 13 lig dışında bir maç — bu yüzden yine de tutabilir ama garantisi yok, kararı sana bırakıyoruz.",
    tum:   "Bültendeki tüm maçlar (geçmiş verisi olsun olmasın).",
    canli: "Şu anda oynanan maçlar; dakika ve skor Nesine'nin canlı veri akışından alınır, en son başlayan üstte. Karşılıklı Gol (MS KG) oranı canlı ve güncel, kupona eklenebilir. 6+ Gol ve İY/MS KG oranları ise Nesine'nin canlıda hiç sunmadığı marketler olduğundan maçın başlamasından hemen önceki son ön-maç değeridir — sadece Kesin/Olası etiketinin dayanağıdır, canlı güncellenmez.",
  };

  /* ============== KUPON (kazanç hesaplayıcı) ============== */
  const IDDAA_CARPAN = 1.037; // Nesine oranı -> iddaa.com tahmini eşdeğeri
  const KUPON_KEY = "kgtahmin-kupon";
  let kupon = [];

  function iddaaOran(nesineOran){
    return (nesineOran === null || nesineOran === undefined) ? null : Math.round(nesineOran * IDDAA_CARPAN * 100) / 100;
  }
  function loadKupon(){
    try { kupon = JSON.parse(localStorage.getItem(KUPON_KEY)) || []; }
    catch (e) { kupon = []; }
  }
  function saveKupon(){ localStorage.setItem(KUPON_KEY, JSON.stringify(kupon)); }
  function isInKupon(id){ return kupon.some(k => k.id === id); }
  function kuponOranToplam(){ return kupon.reduce((acc, k) => acc * k.oran, 1); }

  function toggleKupon(m){
    const idx = kupon.findIndex(k => k.id === m.id);
    if (idx >= 0){
      kupon.splice(idx, 1);
    } else {
      // Canlı maçlarda gerçek güncel oran m.canliMsKg'de; maç öncesi
      // maçlarda bu alan hiç yok, o zaman donmuş m.msKg'ye düşülür.
      const kgOran = m.canliMsKg ?? m.msKg;
      if (kgOran == null) return;
      kupon.push({ id: m.id, evSahibi: m.evSahibi, deplasman: m.deplasman, oran: iddaaOran(kgOran) });
    }
    saveKupon();
    renderKupon();
    renderList();
  }

  function renderKuponPill(){
    const pill = $("kuponPill");
    pill.classList.toggle("empty", kupon.length === 0);
    $("kuponPillCount").textContent = kupon.length;
    $("kuponPillOran").textContent = kupon.length ? fmtOdd(kuponOranToplam()) : "–";
  }

  function renderKuponList(){
    const el = $("kuponList");
    if (kupon.length === 0){
      el.innerHTML = '<div class="kupon-empty">Kuponunuzda maç bulunmamaktadır.<br>Bültenden maç ekleyerek başlayabilirsiniz.</div>';
      return;
    }
    el.innerHTML = kupon.map(k =>
      '<div class="kupon-item" data-id="' + escapeHtml(k.id) + '">' +
        '<div class="kupon-item-info">' +
          '<div class="kupon-item-teams">' + escapeHtml(k.evSahibi) + ' — ' + escapeHtml(k.deplasman) + '</div>' +
          '<div class="kupon-item-market">Karşılıklı Gol · Var</div>' +
        '</div>' +
        '<div class="kupon-item-right">' +
          '<span class="kupon-item-odd">' + fmtOdd(k.oran) + '</span>' +
          '<button type="button" class="kupon-item-remove" data-id="' + escapeHtml(k.id) + '">✕</button>' +
        '</div>' +
      '</div>'
    ).join("");
  }

  function renderKuponCalc(){
    $("calcCount").textContent = kupon.length;
    const toplam = kupon.length ? kuponOranToplam() : 0;
    $("calcOran").textContent = kupon.length ? fmtOdd(toplam) : "0,00";
    const stake = parseFloat($("stakeInput").value) || 0;
    const kazanc = stake * toplam;
    $("calcKazanc").textContent = kazanc.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
  }

  function renderKupon(){
    renderKuponPill();
    renderKuponList();
    renderKuponCalc();
    syncDock();
  }

  function syncDock(){
    const onKupon = !$("kuponScreen").hidden;
    $("dockBulten").classList.toggle("active", !onKupon);
    $("kuponPill").classList.toggle("active", onKupon);
  }
  function showKuponScreen(){
    $("bultenScreen").hidden = true;
    $("kuponScreen").hidden = false;
    syncDock();
  }
  function hideKuponScreen(){
    $("kuponScreen").hidden = true;
    $("bultenScreen").hidden = false;
    syncDock();
  }

  function removeFromKupon(id){
    const node = $("kuponList").querySelector('.kupon-item[data-id="' + CSS.escape(id) + '"]');
    const finish = () => {
      kupon = kupon.filter(k => k.id !== id);
      saveKupon();
      renderKupon();
      renderList();
    };
    if (!node){ finish(); return; }
    node.classList.add("removing");
    setTimeout(finish, 260);
  }

  $("kuponPill").addEventListener("click", showKuponScreen);
  $("dockBulten").addEventListener("click", hideKuponScreen);
  $("kuponBackBtn").addEventListener("click", hideKuponScreen);
  $("kuponClearBtn").addEventListener("click", () => {
    kupon = [];
    saveKupon();
    renderKupon();
    renderList();
  });
  $("kuponList").addEventListener("click", (ev) => {
    const btn = ev.target.closest(".kupon-item-remove");
    if (!btn) return;
    removeFromKupon(btn.dataset.id);
  });
  $("stakeInput").addEventListener("input", renderKuponCalc);

  loadKupon();
  renderKupon();

  /* ============== HELPERS ============== */
  function fmtOdd(v){
    return (v === null || v === undefined) ? null : v.toFixed(2).replace(".", ",");
  }
  function fmtKickoff(iso){
    const d = new Date(iso);
    if (isNaN(d)) return "-";
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    if (sameDay) return hh + ":" + mm;
    const dd = String(d.getDate()).padStart(2,"0");
    const MM = String(d.getMonth()+1).padStart(2,"0");
    return dd + "." + MM + " " + hh + ":" + mm;
  }
  function fmtPct(rate){ return Math.round(rate * 100) + "%"; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function oddChip(label, value){
    const v = fmtOdd(value);
    return '<div class="odd-chip"><div class="lbl">' + label + '</div>' +
      '<div class="val' + (v===null ? " dash" : "") + '">' + (v===null ? "–" : v) + '</div></div>';
  }
  function statChip(cls, label, value){
    return '<div class="stat-chip ' + cls + '"><div class="lbl">' + label + '</div>' +
      '<div class="val">' + value + '</div></div>';
  }

  function matchCard(m){
    if (m.canli) return liveMatchCard(m);

    const tier = m.guven; // "kesin" | "olasi" | null
    const inKupon = isInKupon(m.id);

    let inner = "";
    if (tier){
      const pct = Math.round(m.tutmaOrani * 100);
      // Kombinasyon arşivi %100 tutmuş olsa bile lig takip ettiğimiz 13'ün
      // dışındaysa etiket "olasi" kalır (bkz. guvenHesapla) — bu durumda
      // "%100" yazan bir Arşiv çipi "Olası" rozetinin yanında çelişkili
      // görünür, o yüzden burada nedeni düz yazıyla açıklıyoruz.
      const disLigNedeniyle = tier === "olasi" && m.ligUygun === false && m.toplam >= 3 && m.tutmaOrani === 1;
      inner += '<div class="chip-row">' +
        statChip(tier, "Güven", tier === "kesin" ? "Kesin" : "Olası") +
        statChip(tier, "Kombinasyon", Math.floor(m.iymsKg) + " / " + Math.floor(m.altUst6)) +
        (disLigNedeniyle
          ? statChip(tier, "Not", "13 lig dışında")
          : statChip(tier + " pct", "Arşiv", m.tutma + "/" + m.toplam + " · %" + pct)) +
        '</div>';
    }
    inner += '<div class="chip-row">' +
      oddChip("MS KG", m.msKg) +
      oddChip("6+ Gol", m.altUst6) +
      oddChip("İY/MS KG", m.iymsKg) +
      '</div>';
    inner += '<button type="button" class="add-coupon-btn' + (inKupon ? " added" : "") + '"' +
      (m.msKg == null ? " disabled" : "") + ' data-id="' + escapeHtml(m.id) + '">' +
      (inKupon ? "Kuponda ✓ — Kaldırmak için dokun" : "Kupona Ekle (Karşılıklı Gol · Var, ~" + fmtOdd(iddaaOran(m.msKg)) + ")") +
      '</button>';

    let html = '<div class="match-card' + (tier ? " tier-" + tier : "") + (expandedIds.has(m.id) ? " expanded" : "") + '">';
    html += '<button type="button" class="card-head">' +
      '<div class="match-top"><span class="league">' + escapeHtml(m.lig) + '</span>' +
        '<span class="kickoff-wrap">' + (inKupon ? '<span class="in-kupon-dot" title="Kuponda"></span>' : "") +
        '<span class="kickoff">' + fmtKickoff(m.macZamani) + '</span></span></div>' +
      '<div class="teams-row"><span class="teams">' + escapeHtml(m.evSahibi) + ' — ' + escapeHtml(m.deplasman) + '</span>' +
        '<span class="chevron">▾</span></div>' +
      '</button>';
    html += '<div class="details"><div class="details-inner"><div class="details-content">' + inner + '</div></div></div>';
    html += '</div>';
    return html;
  }

  function liveMatchCard(m){
    const skorVar = m.skorEv != null && m.skorDep != null;
    const skorTxt = skorVar ? (m.skorEv + " - " + m.skorDep) : "–";
    const tier = m.guven; // "kesin" | "olasi" | null
    const donukOranVar = m.msKg != null || m.altUst6 != null || m.iymsKg != null;
    const canliKgOran = m.canliMsKg; // her zaman güncel, dondurulmuş DEĞİL
    const inKupon = isInKupon(m.id);

    let inner = '<div class="live-detail-note">🔴 Canlı · ' + escapeHtml(m.dakika) +
      (skorVar ? " · Skor " + skorTxt : "") + '</div>';

    if (m.kirmiziSinyal){
      const s = m.kirmiziSinyal;
      inner += '<div class="kirmizi-sinyal">' +
        '<div class="kirmizi-sinyal-baslik">🔴 Kırmızı Sinyal</div>' +
        '<div class="kirmizi-sinyal-tahmin">' + escapeHtml(s.tahmin || s.taktik || "") + '</div>' +
        '<div class="kirmizi-sinyal-detay">' +
          (s.dk != null ? "Sinyal dakikası: " + escapeHtml(String(s.dk)) + "'" : "") +
          (s.minOran != null ? " · Min. oran: " + escapeHtml(String(s.minOran)) : "") +
          (s.oranDurumu && s.oranDurumu.pazarAcik ? " · Nesine'de doğrulandı (" + escapeHtml(s.oranDurumu.market) + ": " + escapeHtml(String(s.oranDurumu.oran)) + ")" : "") +
        '</div>' +
      '</div>';
    }

    if (tier){
      const pct = Math.round(m.tutmaOrani * 100);
      // Kombinasyon arşivi %100 tutmuş olsa bile lig takip ettiğimiz 13'ün
      // dışındaysa etiket "olasi" kalır (bkz. guvenHesapla) — bu durumda
      // "%100" yazan bir Arşiv çipi "Olası" rozetinin yanında çelişkili
      // görünür, o yüzden burada nedeni düz yazıyla açıklıyoruz.
      const disLigNedeniyle = tier === "olasi" && m.ligUygun === false && m.toplam >= 3 && m.tutmaOrani === 1;
      inner += '<div class="chip-row">' +
        statChip(tier, "Güven", tier === "kesin" ? "Kesin" : "Olası") +
        statChip(tier, "Kombinasyon", Math.floor(m.iymsKg) + " / " + Math.floor(m.altUst6)) +
        (disLigNedeniyle
          ? statChip(tier, "Not", "13 lig dışında")
          : statChip(tier + " pct", "Arşiv", m.tutma + "/" + m.toplam + " · %" + pct)) +
        '</div>';
    }
    if (canliKgOran != null || donukOranVar){
      inner += '<div class="chip-row">' +
        oddChip(canliKgOran != null ? "MS KG · Canlı" : "MS KG", canliKgOran != null ? canliKgOran : m.msKg) +
        (donukOranVar ? oddChip("6+ Gol", m.altUst6) + oddChip("İY/MS KG", m.iymsKg) : "") +
        '</div>';
    }
    if (canliKgOran != null){
      inner += '<button type="button" class="add-coupon-btn' + (inKupon ? " added" : "") + '" data-id="' + escapeHtml(m.id) + '">' +
        (inKupon ? "Kuponda ✓ — Kaldırmak için dokun" : "Kupona Ekle (Karşılıklı Gol · Var, ~" + fmtOdd(iddaaOran(canliKgOran)) + ")") +
        '</button>';
    }
    if (donukOranVar){
      inner += '<p class="section-note" style="margin:8px 4px 0;">6+ Gol ve İY/MS KG oranları Nesine\'nin canlıda hiç sunmadığı marketler olduğundan maçın başlamasından hemen önceki son ön-maç değeridir' +
        (m.tahminZamani ? " (" + fmtKickoff(m.tahminZamani) + ")" : "") +
        ' — sadece Kesin/Olası etiketinin dayanağıdır, canlı güncellenmez.' +
        (canliKgOran == null ? " MS KG oranı da bu maçta canlıda kapalı." : " MS KG oranı ise canlı ve güncel, kupona eklenebilir.") + '</p>';
    } else if (canliKgOran == null){
      inner += '<p class="section-note" style="margin:8px 4px 0;">Bu maç için Nesine\'de Karşılıklı Gol/6+ Gol/İY-MS-KG oranı hiç açılmamış — genellikle düşük profilli/alt lig maçlarında görülür, sistemsel bir sorun değildir.</p>';
    }

    let html = '<div class="match-card' + (tier ? " tier-" + tier : "") + (m.kirmiziSinyal ? " tier-kirmizi" : "") + (expandedIds.has(m.id) ? " expanded" : "") + '">';
    html += '<button type="button" class="card-head">' +
      '<div class="match-top"><span class="league">' + escapeHtml(m.lig) +
        (m.kirmiziSinyal ? ' <span class="kirmizi-badge">🔴 Sinyal</span>' : "") + '</span>' +
        '<span class="kickoff-wrap">' + (inKupon ? '<span class="in-kupon-dot" title="Kuponda"></span>' : "") +
        '<span class="live-badge"><span class="live-dot"></span>' + escapeHtml(m.dakika) + '</span></span></div>' +
      '<div class="teams-row"><span class="teams">' + escapeHtml(m.evSahibi) +
        (skorVar ? ' <span class="live-score">' + skorTxt + '</span> ' : ' — ') +
        escapeHtml(m.deplasman) + '</span>' +
        '<span class="chevron">▾</span></div>' +
      '</button>';
    html += '<div class="details"><div class="details-inner"><div class="details-content">' + inner + '</div></div></div>';
    html += '</div>';
    return html;
  }

  /* ============== FILTER / SORT / RENDER ============== */
  function tabMatches(view){
    if (view === "kesin") return allMatches.filter(m => m.guven === "kesin");
    if (view === "olasi") return allMatches.filter(m => m.guven === "olasi");
    if (view === "canli") return liveMatches.slice();
    return allMatches.slice();
  }

  function rebuildLeagueOptions(){
    const matches = tabMatches(currentView);
    const leagues = [...new Set(matches.map(m => m.lig))].sort((a,b) => a.localeCompare(b, "tr"));
    const prev = currentLeague;
    ligSelectEl.innerHTML = '<option value="">Tüm Ligler</option>' +
      leagues.map(l => '<option value="' + escapeHtml(l) + '">' + escapeHtml(l) + '</option>').join("");
    if (leagues.includes(prev)){
      ligSelectEl.value = prev;
    } else {
      currentLeague = "";
      ligSelectEl.value = "";
    }
  }

  function matchesSearch(m, q){
    const hay = (m.evSahibi + " " + m.deplasman + " " + m.lig).toLocaleLowerCase("tr");
    return hay.includes(q);
  }

  function renderList(){
    let matches = tabMatches(currentView);
    if (currentLeague) matches = matches.filter(m => m.lig === currentLeague);
    if (searchQuery) matches = matches.filter(m => matchesSearch(m, searchQuery));
    // Kırmızı bot sinyali gelen maçlar, seçili sıralama ne olursa olsun
    // (Kesin/Olası ayrımından bağımsız) her zaman en üstte gösterilir.
    matches = matches.slice().sort((a, b) => {
      const aSinyal = a.kirmiziSinyal ? 1 : 0;
      const bSinyal = b.kirmiziSinyal ? 1 : 0;
      if (aSinyal !== bSinyal) return bSinyal - aSinyal;
      return SORTS[currentSort].cmp(a, b);
    });

    $("list").innerHTML = matches.map(matchCard).join("");
    $("emptyNote").style.display = matches.length ? "none" : "block";
    $("emptyNote").textContent = searchQuery ? "Aramanla eşleşen maç yok." : "Kriterlere uyan maç yok.";
    $("tabNote").textContent = VIEW_NOTES[currentView];
  }

  function updateTabCounts(){
    const c = {
      tum: allMatches.length,
      kesin: allMatches.filter(m => m.guven === "kesin").length,
      olasi: allMatches.filter(m => m.guven === "olasi").length,
      canli: liveMatches.length,
    };
    Array.from(viewSelectEl.options).forEach(o => {
      const base = o.dataset.label || o.textContent.replace(/\s*\(\d+\)\s*$/, "");
      o.dataset.label = base;
      o.textContent = base + " (" + (c[o.value] ?? 0) + ")";
    });
  }

  $("list").addEventListener("click", (ev) => {
    const addBtn = ev.target.closest(".add-coupon-btn");
    if (addBtn){
      const m = allMatches.find(x => x.id === addBtn.dataset.id) || liveMatches.find(x => x.id === addBtn.dataset.id);
      if (m) toggleKupon(m);
      return;
    }
    const head = ev.target.closest(".card-head");
    if (!head) return;
    const card = head.closest(".match-card");
    const id = card.querySelector(".add-coupon-btn")?.dataset.id;
    card.classList.toggle("expanded");
    if (id){
      if (card.classList.contains("expanded")) expandedIds.add(id);
      else expandedIds.delete(id);
    }
  });

  const ligSelectEl = $("ligSelect");
  const viewSelectEl = $("viewSelect");
  viewSelectEl.value = currentView;
  ligSelectEl.addEventListener("change", () => { currentLeague = ligSelectEl.value; renderList(); });
  sortSelectEl.addEventListener("change", () => { currentSort = sortSelectEl.value; renderList(); });
  $("searchInput").addEventListener("input", (ev) => {
    searchQuery = ev.target.value.trim().toLocaleLowerCase("tr");
    renderList();
  });

  viewSelectEl.addEventListener("change", () => {
    currentView = viewSelectEl.value;
    currentSort = (currentView === "canli") ? "live_recent"
                : (currentView === "tum") ? "time_asc"
                : "rate_desc";
    sortSelectEl.value = currentSort;
    rebuildLeagueOptions();
    renderList();
  });

  /* ============== LOAD ============== */
  function render(data){
    allMatches = data.maclar || [];

    $("statTotal").textContent = allMatches.length;
    $("statKesin").textContent = allMatches.filter(m => m.guven === "kesin").length;
    $("statOlasi").textContent = allMatches.filter(m => m.guven === "olasi").length;
    if (data.guncellemeZamani){
      const d = new Date(data.guncellemeZamani);
      $("statUpdated").textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    }

    updateTabCounts();
    rebuildLeagueOptions();
    renderList();
    renderKupon();
  }

  /* ============== VERİ YÜKLEME ==============
     Sayfa da veri API'si de aynı Cloudflare Worker'dan (aynı origin) servis
     edilir — Nesine'den anlık çeker, edge'de cache'ler. Statik dosya / GitHub
     Actions fallback'i yok, sistem tamamen Cloudflare üzerinde çalışır. */
  const LIVE_ENDPOINT = "/api/bulten";
  const LIVE_CANLI_ENDPOINT = "/api/canli";

  function fetchJson(url){
    return fetch(url, {cache: "no-store"}).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function loadLiveMatches(){
    return fetchJson(LIVE_CANLI_ENDPOINT)
      .then(data => { liveMatches = (data.maclar || []).map(m => Object.assign({canli: true}, m)); })
      .catch(() => { liveMatches = []; });
  }

  function load(){
    Promise.all([fetchJson(LIVE_ENDPOINT), loadLiveMatches()])
      .then(([data]) => render(data))
      .catch(() => {
        $("emptyNote").textContent = "Bülten yüklenemedi.";
        $("emptyNote").style.display = "block";
      });
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") load();
  });

  load();
  setInterval(load, 60 * 1000);
})();
</script>

</body>
</html>
