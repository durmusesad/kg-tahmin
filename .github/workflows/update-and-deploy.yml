name: Bülteni Güncelle ve Deploy Et

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Bülteni çek
        run: python scraper.py

      - name: Veriyi commit'le (değiştiyse)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/odds.json data/live.json; then
            git add data/odds.json data/live.json
            git commit -m "Bülten güncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
